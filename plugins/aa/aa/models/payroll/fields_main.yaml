fields:

    salare_id:
        label: 'aa.aa::lang.model.payroll.salare'
        span: auto
        type: dropdown
        placeholder: aa.aa::lang.plugin.select
        
    discount:
        label: 'aa.aa::lang.model.payroll.discount'
        type: number
        span: auto
        
    price:
        label: 'aa.aa::lang.model.payroll.price'
        type: number
        span: auto
        dependsOn: 
            - discount
            - salare_id
        
    status: 
        label: 'aa.aa::lang.model.payroll.status'
        span: auto
        type: switch
    _logbook@update:
        type: jacob_logbook_log
        limitPerPage: 10 
        startPage: 1 
        permissions: log_changes_aa
        showUndoChangesButton: true 
        refreshFormAfterUndo: true  