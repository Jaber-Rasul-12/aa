fields:


    salare_id:
        label: 'aa.aa::lang.model.payroll.salare'
        span: auto
        type: dropdown
        placeholder: aa.aa::lang.plugin.select
    status: 
        label: 'aa.aa::lang.model.payroll.status'
        span: auto
        type: switch
    october_month:
        label: 'الشهر العاشر '
        type: section
        comment: 'هاذ القسم خاص بالشهر العاشر   فقط'        
    with_october:
        label: 'هل تود تسليم راتب  الشهر التاسع'
        span: auto
        type: switch
        default: 1
    discount:
        label: 'aa.aa::lang.model.payroll.discount'
        type: number
        span: auto
        default: 0
        
    price:
        label: 'aa.aa::lang.model.payroll.price'
        type: number
        span: auto
        dependsOn: 
            - discount
            - salare_id
    september_month:
        label: 'الشهر التاسع '
        type: section
        comment: 'هاذ القسم خاص بالشهر التاسع اذا كنت تريد تسليم راتب الشهر التاسع ( قم بتغعيل الشهر التاسع من الاسفل و اضف الخصم ان وجد )    '        
    with_september:
        label: 'هل تود تسليم راتب  الشهر العاشر'
        span: auto
        type: switch
    discount_september: 
        label: 'خصم الشهر التاسع'
        type: number
        span: auto
        trigger:
            action: show
            field: with_september
            condition: checked

    _logbook@update:
        type: jacob_logbook_log
        limitPerPage: 10 
        startPage: 1 
        permissions: log_changes_aa
        showUndoChangesButton: true 
        refreshFormAfterUndo: true  