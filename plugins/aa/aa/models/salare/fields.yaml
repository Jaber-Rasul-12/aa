fields:
    currency:
        label: 'aa.aa::lang.model.salare.currency'
        span: auto
        type: dropdown
        options:
            dollar: 'aa.aa::lang.model.salare.dollar'
            syrian: 'aa.aa::lang.model.salare.syrian'
    price:
        label: 'aa.aa::lang.model.salare.price'
        span: auto
        type: number
    _logbook@update:
        type: jacob_logbook_log
        limitPerPage: 10 
        startPage: 1 
        permissions: log_changes_aa
        showUndoChangesButton: true 
        refreshFormAfterUndo: true  